<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insurance Charges Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .btn-primary {
            background: linear-gradient(45deg, #ff6a00, #ee0979);
            border: none;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #ee0979, #ff6a00);
        }
        h2 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }
        label {
            font-weight: 600;
        }
        select, input {
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Insurance Charges Prediction</h2>
        <form action="/predict" method="post">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Age</label>
                    <input type="number" name="age" class="form-control" required>
                </div>
                <div class="form-group col-md-6">
                    <label>Sex</label>
                    <select name="sex" class="form-control" required>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>BMI</label>
                    <input type="number" step="0.1" name="bmi" class="form-control" required>
                </div>
                <div class="form-group col-md-6">
                    <label>Children</label>
                    <input type="number" name="children" class="form-control" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Smoker</label>
                    <select name="smoker" class="form-control" required>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
                <div class="form-group col-md-6">
                    <label>Region</label>
                    <select name="region" class="form-control" required>
                        <option value="southwest">Southwest</option>
                        <option value="southeast">Southeast</option>
                        <option value="northwest">Northwest</option>
                        <option value="northeast">Northeast</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Predict Charges</button>
        </form>
    </div>
</div>
</body>
</html>
